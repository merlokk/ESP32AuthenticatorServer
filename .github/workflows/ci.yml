# Checks both halves, then builds the images and pushes them to GHCR:
#   ghcr.io/merlokk/esp32authenticatorserver-backend
#   ghcr.io/merlokk/esp32authenticatorserver-frontend
#   ghcr.io/merlokk/esp32authenticatorserver-migrations  (the Job that runs before the backend rolls)
# Tags: sha-<short> on every push, latest on main, <x.y.z> and <x.y> on an x.y.z git tag (no "v").
# Pull requests build the images without pushing.

name: CI

on:
  push:
    branches: [main]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/merlokk/esp32authenticatorserver

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build backend/AuthServer.slnx --configuration Release
      - run: dotnet test backend/AuthServer.slnx --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check

  images:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { part: backend, context: backend, file: backend/Dockerfile }
          - { part: frontend, context: frontend, file: frontend/Dockerfile }
          - { part: migrations, context: backend, file: backend/migrations.Dockerfile }
    steps:
      # git describe needs the tags and the history back to the last one.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The product version is git's: 0.5.0-0-gb249c4e on the tag, 0.5.0-3-gabc1234 after it.
      - id: version
        run: echo "version=$(git describe --tags --match='*' --long)" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.part }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - uses: docker/setup-buildx-action@v4

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Only the backend Dockerfile declares these; the others ignore them.
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.part }}
          cache-to: type=gha,scope=${{ matrix.part }},mode=max
